[tool.poetry]
name = "bachelor-project"
version = "0.1.0"
description = ""
authors = ["Tina","Ola"]
readme = "README.md"

# Include both packages from "src/"
packages = [
    { include = "api_routes", from = "src" },
    { include = "georeferencing", from = "src" },
    { include = "data", from = "src" },
    { include = "utils", from = "src" },
    { include = "services", from = "src" },
    { include = "logic", from = "src"}
]


[tool.poetry.dependencies]
python = ">=3.11"
numpy = ">=2.2.2,<3.0.0"
opencv-python = ">=4.11.0.86,<5.0.0.0"
requests = ">=2.32.3,<3.0.0"
python-dotenv = ">=1.0.1,<2.0.0"
sympy = ">=1.13.3,<2.0.0"
pyproj = ">=3.7.0,<4.0.0"
matplotlib = "^3.10.0"
fastapi = {extras = ["standard"], version = "^0.115.12"}
uvicorn = "^0.34.0"
folium = "^0.19.4"
h5py = "^3.13.0"
pytest = "^8.3.5"
roboflow = "^1.1.61"
ultralytics = "^8.3.119"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
