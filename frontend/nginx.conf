server {
  listen 80;
  server_name localhost; # You can change this if needed for specific environments

  # Root directory for Nginx to serve files from
  # This should match the destination of the COPY command in your Dockerfile's Nginx stage
  root /usr/share/nginx/html/browser;

  # Default file to serve
  index index.html index.htm;

  # This is important for Single Page Applications (SPAs) like Angular.
  # It ensures that all routes are directed to index.html,
  # allowing Angular's router to handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: You can add specific configurations for API proxies here
  # if you want Nginx to proxy requests to your backend.
  # location /api/ {
  #   proxy_pass http://backend:8000/; # 'backend' is the service name in docker-compose
  #   # Add other proxy headers as needed
  # }
}
