server {
  listen 80;
  server_name localhost; # You can change this if needed for specific environments

  # Root directory for Nginx to serve files from
  # This should match the destination of the COPY command in your Dockerfile's Nginx stage
  root /usr/share/nginx/html/browser;

  # Default file to serve
  index index.html index.htm;

  # This is important for Single Page Applications (SPAs) like Angular.
  # It ensures that all routes are directed to index.html,
  # allowing Angular's router to handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the backend service
  # Any request to /api/... on the frontend will be forwarded to the backend
  location /api/ {
    # 'backend' is the service name from your docker-compose.yaml
    # Docker's internal DNS will resolve 'backend' to the backend container's IP
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Increase timeouts to give the backend more time
    proxy_connect_timeout 1200s;
    proxy_send_timeout 1200s;
    proxy_read_timeout 1200s;
    send_timeout 1200s;
  }
}
