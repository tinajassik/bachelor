name: Run Angular Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' 

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run Angular tests
        working-directory: frontend
        run: npm run test -- --watch=false --browsers=ChromeHeadless
